name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set environment variables
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "ENV=prod" >> $GITHUB_ENV
          echo "API_KEY=prod_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        else
          echo "ENV=test" >> $GITHUB_ENV
          echo "API_KEY=test_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
        fi

    - name: Build deployment package using Lambda-compatible Docker image
      run: |
        mkdir -p build
        cp lambda_function/app.py requirements.txt build/

        docker run --rm -v "$PWD/build":/var/task public.ecr.aws/lambda/python:3.12 bash -c "
          pip install -r requirements.txt -t ./package && \
          cp app.py ./package && \
          cd package && \
          zip -r9 ../lambda.zip .
        "

    - name: Deploy to AWS Lambda
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        FUNCTION_NAME="cicd_lambda_${{ github.ref_name }}"
        REGION="us-east-1"

        echo "Deploying to Lambda function: $FUNCTION_NAME"

        FUNCTION_EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME --region $REGION || echo "false")

        ENV_VARS="Variables={ENV=${{ env.ENV }},API_KEY=${{ env.API_KEY }},LOG_LEVEL=${{ env.LOG_LEVEL }}}"

        if [ "$FUNCTION_EXISTS" == "false" ]; then
          echo "Creating Lambda function $FUNCTION_NAME..."
          aws lambda create-function \
            --function-name $FUNCTION_NAME \
            --runtime python3.12 \
            --role arn:aws:iam::253490785233:role/test_lamda_dev \
            --handler app.lambda_handler \
            --timeout 300 \
            --zip-file fileb://build/lambda.zip \
            --region $REGION \
            --environment "$ENV_VARS"
        else
          echo "Updating Lambda function $FUNCTION_NAME..."

          # Update function code
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --zip-file fileb://build/lambda.zip

          # Wait until update completes
          echo "Waiting for Lambda to finish updating..."
          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME \
            --region $REGION

          # Update environment variables
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --environment "$ENV_VARS"
        fi
