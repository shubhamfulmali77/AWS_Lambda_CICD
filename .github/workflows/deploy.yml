name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-24.04  # Python 3.12 supported

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install zip & Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y zip docker.io
        sudo systemctl start docker

    - name: Set environment variables
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "ENV=prod" >> $GITHUB_ENV
          echo "API_KEY=prod_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        else
          echo "ENV=test" >> $GITHUB_ENV
          echo "API_KEY=test_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
        fi

    - name: Package Lambda with Docker (Amazon Linux 2)
      run: |
        cd lambda_function
        mkdir -p package
        cp app.py requirements.txt package/

        docker run --rm -v "$PWD/package":/var/task lambci/lambda:build-python3.12 \
          /bin/bash -c "pip install --upgrade pip && pip install -r requirements.txt -t ."

        cd package
        zip -r9 ../lambda.zip .
        cd ..

    - name: Deploy to AWS Lambda
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        FUNCTION_NAME="cicd_lambda_${{ github.ref_name }}"
        REGION="us-east-1"

        echo "Deploying to Lambda function: $FUNCTION_NAME"

        FUNCTION_EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME --region $REGION || echo "false")

        ENV_VARS="Variables={ENV=${{ env.ENV }},API_KEY=${{ env.API_KEY }},LOG_LEVEL=${{ env.LOG_LEVEL }}}"

        if [ "$FUNCTION_EXISTS" == "false" ]; then
          echo "Creating Lambda function $FUNCTION_NAME..."
          aws lambda create-function \
            --function-name $FUNCTION_NAME \
            --runtime python3.12 \
            --role arn:aws:iam::253490785233:role/test_lamda_dev \
            --handler app.lambda_handler \
            --timeout 300 \
            --zip-file fileb://lambda_function/lambda.zip \
            --region $REGION \
            --environment "$ENV_VARS"
        else
          echo "Updating Lambda function $FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --zip-file fileb://lambda_function/lambda.zip

          echo "Waiting for function code update to complete..."
          while true; do
            STATUS=$(aws lambda get-function --function-name $FUNCTION_NAME --region $REGION --query 'Configuration.LastUpdateStatus' --output text)
            if [ "$STATUS" == "Successful" ]; then
              echo "Function update successful."
              break
            elif [ "$STATUS" == "Failed" ]; then
              echo "Function update failed."
              exit 1
            else
              echo "Update in progress..."
              sleep 5
            fi
          done

          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --environment "$ENV_VARS"
        fi
