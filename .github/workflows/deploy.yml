name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set Environment Variables
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "ENV=prod" >> $GITHUB_ENV
          echo "API_KEY=prod_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        else
          echo "ENV=test" >> $GITHUB_ENV
          echo "API_KEY=test_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
        fi

    - name: Package Lambda with Docker (Amazon Linux 2023 + Python 3.12)
      run: |
        mkdir -p package

        docker run --rm -v "$PWD":/app -w /app amazonlinux:2023 bash -c "
          yum install -y python3.12 python3.12-devel python3.12-pip zip gcc git &&
          alternatives --install /usr/bin/python python /usr/bin/python3.12 1 &&
          python -m venv venv &&
          source venv/bin/activate &&
          pip install --upgrade pip &&
          pip install -r lambda_function/requirements.txt -t package &&
          cp lambda_function/app.py package/ &&
          cd package &&
          zip -r9 ../lambda.zip .
        "

    - name: Deploy to AWS Lambda
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        FUNCTION_NAME="cicd_lambda_${{ github.ref_name }}"
        REGION="us-east-1"
        ENV_VARS="Variables={ENV=${{ env.ENV }},API_KEY=${{ env.API_KEY }},LOG_LEVEL=${{ env.LOG_LEVEL }}}"

        echo "Deploying $FUNCTION_NAME..."

        if aws lambda get-function --function-name $FUNCTION_NAME --region $REGION; then
          echo "Updating function code..."
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --zip-file fileb://lambda.zip

          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --environment "$ENV_VARS"
        else
          echo "Creating new Lambda function..."
          aws lambda create-function \
            --function-name $FUNCTION_NAME \
            --runtime python3.12 \
            --role arn:aws:iam::253490785233:role/test_lamda_dev \
            --handler app.lambda_handler \
            --timeout 300 \
            --zip-file fileb://lambda.zip \
            --region $REGION \
            --environment "$ENV_VARS"
        fi
